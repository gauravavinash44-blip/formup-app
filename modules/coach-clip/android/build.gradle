plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.coachclip'
version = '0.1.0'

android {
  namespace "expo.modules.coachclip"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Media3 Transformer re-encodes the clip with the overlay drawn on each frame.
  def media3 = "1.8.0"
  implementation "androidx.media3:media3-transformer:$media3"
  implementation "androidx.media3:media3-effect:$media3"
  implementation "androidx.media3:media3-common:$media3"
  implementation "androidx.annotation:annotation:1.9.1"
}
